name: Temporary Lumen learning validation

on:
  push:
    branches:
      - ci/test-merged-skill-learning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out merged master plus the CLI fix
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile changed learning and vault modules
        run: python -m compileall -q actions/self_development.py actions/vault_memory.py actions/web_search.py memory/vault_cli.py memory/vault_manager.py selfdev/learning.py selfdev/skills.py

      - name: Test self-development and progressive skill loading
        run: python -m unittest discover -s tests -p "test_selfdev.py" -v

      - name: Test skill proposal, approval, rejection and version history
        run: python -m unittest discover -s tests -p "test_skill_no_extra_model_call.py" -v

      - name: Test Obsidian vault operations and Agent Skills export
        run: python -m unittest discover -s tests -p "test_vault.py" -v

      - name: Test free search never calls Gemini grounding
        run: python -m unittest discover -s tests -p "test_web_search_free_mode.py" -v
